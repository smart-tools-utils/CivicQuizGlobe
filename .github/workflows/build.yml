name: Build and Sign Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare environment configuration
        run: |
          touch .env
          if [ ! -f .env.example ]; then
            touch .env.example
          fi

      - name: Restore signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Keystore successfully restored."
          elif [ -f debug.keystore ]; then
            echo "debug.keystore already present."
          else
            echo "WARNING: Neither debug.keystore.base64 nor debug.keystore found."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --continue || echo "Tests finished"

      - name: Build Signed APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Generated APK
        run: |
          echo "Generated APK files:"
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CivicQuiz-Signed-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
